# config/costs.yaml
# Cost matrices for peptide screening decision frameworks
# All values are OWNER-INPUT placeholders (Decision D2 in BLOCKERS.md)

version: "1.0.0"
status: "DRAFT_PENDING_OWNER_INPUT"

profiles:
  vaccine:
    description: "Screening vaccine candidate antigens (high immunogenicity, no toxicity, no allergenicity)"
    costs:
      # Cost of taking a candidate to wet-lab synthesis & validation
      c_inspect_usd: 100.0
      # Cost of advancing a missed toxic sequence into preclinical development
      c_missed_toxic_usd: 5000.0  # OWNER-INPUT
      # Cost of advancing a missed allergenic sequence into preclinical development
      c_missed_allergenic_usd: 2500.0  # OWNER-INPUT
      # Opportunity cost of falsely discarding a genuine protective antigen
      c_false_negative_antigen_usd: 1000.0  # OWNER-INPUT
      # Cost of false alarm (synthesizing a non-antigen)
      c_false_positive_antigen_usd: 50.0  # OWNER-INPUT

  therapeutic:
    description: "Screening therapeutic peptides (non-immunogenic, no toxicity, no allergenicity)"
    costs:
      c_inspect_usd: 100.0
      c_missed_toxic_usd: 5000.0  # OWNER-INPUT
      c_missed_allergenic_usd: 3000.0  # OWNER-INPUT
      c_missed_immunogenic_usd: 2000.0  # OWNER-INPUT (antigenicity is undesirable)
      c_false_negative_drug_usd: 2000.0  # OWNER-INPUT
