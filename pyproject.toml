[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peptide-profiler"
version = "1.0.0"
description = "Production-Grade Immunological Screening Pipeline: Antigenicity, Toxicity, Allergenicity, and Physicochemical Characterization"
readme = "README.md"
authors = [
    { name = "Aditya Naikwadi", email = "naikwadiaditya7@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "bioinformatics",
    "computational-biology",
    "peptide-screening",
    "immunology",
    "vaccine-design",
    "peptide-therapeutics",
    "esm2",
    "machine-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "biopython>=1.83",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "onnxruntime>=1.16.0",
    "transformers>=4.38.0",
    "torch>=2.0.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
peptide-profiler = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
